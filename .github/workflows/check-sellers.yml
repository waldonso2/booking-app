name: Anbieter prüfen
# shortcut: one-off check of the target list (docs/SOLL-ANBIETER.md), removed again after the run
on:
  push:
    branches: [ccr-db7c1d22-itd9x5]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_sellers.py < scripts/sellers.txt | tee -a "$GITHUB_STEP_SUMMARY"
