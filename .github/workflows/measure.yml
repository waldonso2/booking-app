name: Messung (USA)

# One measurement from a GitHub runner (US) against the real site, for checking the flow before the
# country comparison on cloud VMs (docs/TESTLAEUFE.md). Results: the run's summary and the artifact "runs".
on:
  workflow_dispatch:
    inputs:
      contact:
        description: Kontakt der Forschungsgruppe (steht im User-Agent)
        required: true
      pick:
        description: Text des Hinflugs, der weiterverfolgt wird (leer = erster)
        default: ""
  push:
    branches: [ccr-db7c1d22-itd9x5]  # shortcut: runs on the work branch while the flow is checked, remove after

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        to: [ATL, MNL]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: "pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - name: measure
        env:
          TO: ${{ matrix.to }}
          CONTACT: ${{ inputs.contact || 'www.contact.com' }}
          PICK: ${{ inputs.pick }}
        run: |
          booking-app measure --country US --from FRA --to "$TO" --depart 2027-03-26 --return 2027-04-09 \
            --cabin business --contact "$CONTACT" --pick "$PICK" --out "runs/$TO" || status=$?
          {
            echo "## FRA → $TO"
            echo '```json'
            cat "runs/$TO/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "runs/$TO/result.json"
          if [ -f "runs/$TO/error.txt" ]; then head -c 6000 "runs/$TO/error.txt"; fi
          python -c 'import json, sys; r = json.load(open(sys.argv[1])); print("\n==", r["status"], r["error"], r["cabin_shown"]); [print("==", s["name"], len(s["rows"]), s["url"]) for s in r["steps"]]' "runs/$TO/result.json"
          exit "${status:-0}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runs-${{ matrix.to }}
          path: runs/
