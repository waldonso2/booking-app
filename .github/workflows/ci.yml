name: CI

# The kit checks itself with its own workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml
  workflows:
    uses: ./.github/workflows/workflows.yml
  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
