name: Workflows

# zizmor audits the calling repository's GitHub workflows (template injection, permissions, cache
# poisoning, unpinned actions …). Blocking from "medium".
on:
  workflow_call:
    inputs:
      min-severity:
        type: string
        default: medium

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          min-severity: ${{ inputs.min-severity }}
