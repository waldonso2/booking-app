name: Secrets

# gitleaks over the whole history of the calling repository. Its .gitleaks.toml (if any) holds the
# fabricated test values that are allowed. Blocking: a finding fails the job.
on:
  workflow_call:
    inputs:
      config:
        description: gitleaks config in the calling repository
        type: string
        default: .gitleaks.toml

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        env:
          VERSION: 8.21.2
          SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          CONFIG: ${{ inputs.config }}
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -f "$CONFIG" ]; then set -- --config "$CONFIG"; else set --; fi
          /tmp/gitleaks git . "$@" --redact --no-banner
