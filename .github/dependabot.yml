version: 2
updates:
  # requirements.txt / requirements-dev.txt: the locked versions (scripts/lock.sh).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release must be a week old before it is proposed: time for a compromised one to be pulled.
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
